name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.22", "1.23"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          # No third-party dependencies, so there is no go.sum to cache.
          cache: false

      - name: Verify formatting
        if: runner.os == 'Linux'
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "These files are not gofmt-clean:"; echo "$fmt_out"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        shell: bash
        run: |
          # Go 1.22 on macOS arm64 produces race-enabled test binaries without
          # the LC_UUID load command, which makes dyld abort ("signal: abort
          # trap"). This is a toolchain bug fixed in Go 1.23, not a test failure.
          if [ "${{ runner.os }}" = "macOS" ] && [ "${{ matrix.go }}" = "1.22" ]; then
            echo "Skipping -race on macOS + Go 1.22 (upstream dyld LC_UUID bug)"
            go test ./... -count=1
          else
            go test ./... -race -count=1
          fi

      - name: Self-scan (offline)
        if: runner.os == 'Linux'
        run: |
          go build -o spec-guardian ./cmd/spec-guardian
          ./spec-guardian scan . --offline --format all --out-dir ./self-report --no-color || true
          cat ./self-report/specguard-report.txt || true

      - name: Upload self report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: self-report
          path: self-report/specguard-report.html
          if-no-files-found: ignore
