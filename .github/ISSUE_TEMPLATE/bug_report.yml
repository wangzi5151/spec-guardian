name: Bug report
description: Report incorrect behavior in Spec-Guardian
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please do not use this form for security issues —
        see SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Spec-Guardian version
      description: Output of `spec-guardian version`
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the exact command and the observed output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: rules
    attributes:
      label: Custom rules file?
      description: If you used --rules, paste the relevant snippet.
    validations:
      required: false
