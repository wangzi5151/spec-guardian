<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="Spec-Guardian">
<title>Spec-Guardian Report</title>
<style>
  :root{
    --bg:#0f1420; --panel:#171e2e; --panel2:#1e273b; --fg:#e8edf7; --muted:#94a3b8;
    --high:#f87171; --medium:#fbbf24; --low:#38bdf8; --info:#94a3b8; --accent:#818cf8;
    --border:#2a3550;
  }
  @media (prefers-color-scheme: light){
    :root{--bg:#f5f7fb;--panel:#ffffff;--panel2:#eef2f9;--fg:#111827;--muted:#5b6678;--border:#dbe2ee;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}
  header{padding:28px 24px 12px;max-width:1080px;margin:0 auto}
  h1{margin:0 0 4px;font-size:24px}
  .tagline{color:var(--muted);margin:0}
  main{max-width:1080px;margin:0 auto;padding:0 24px 60px}
  .meta{display:flex;flex-wrap:wrap;gap:8px 24px;margin:18px 0;color:var(--muted);font-size:14px}
  .meta code{color:var(--fg)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:18px 0 24px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .card .n{font-size:28px;font-weight:700}
  .card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .card.high .n{color:var(--high)} .card.medium .n{color:var(--medium)}
  .card.low .n{color:var(--low)} .card.info .n{color:var(--info)}
  .controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:16px}
  .controls label{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer}
  input[type=search],select{background:var(--panel2);border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:14px}
  input[type=search]{flex:1;min-width:180px}
  details.finding{background:var(--panel);border:1px solid var(--border);border-left-width:4px;border-radius:10px;margin-bottom:10px;overflow:hidden}
  details.finding[data-sev=high]{border-left-color:var(--high)}
  details.finding[data-sev=medium]{border-left-color:var(--medium)}
  details.finding[data-sev=low]{border-left-color:var(--low)}
  details.finding[data-sev=info]{border-left-color:var(--info)}
  details.finding>summary{cursor:pointer;padding:12px 14px;display:flex;gap:12px;align-items:baseline;list-style:none}
  details.finding>summary::-webkit-details-marker{display:none}
  .sev{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;border:1px solid var(--border);min-width:64px;text-align:center}
  .sev.high{color:var(--high)} .sev.medium{color:var(--medium)} .sev.low{color:var(--low)} .sev.info{color:var(--info)}
  .rid{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);font-size:13px}
  .msg{flex:1}
  .loc{font-family:ui-monospace,monospace;color:var(--muted);font-size:12px}
  .body{padding:0 14px 14px 14px;border-top:1px solid var(--border);color:var(--muted);font-size:14px}
  .body .fix{margin-top:10px}
  .body a{color:var(--accent)}
  .empty{color:var(--muted);padding:30px;text-align:center}
  footer{max-width:1080px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12px}
  .pill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>Spec-Guardian <span class="pill" id="ver"></span></h1>
  <p class="tagline">Open-Source Repository Health Auditor — not a code linter.</p>
  <div class="meta" id="meta"></div>
</header>
<main>
  <div class="cards" id="cards"></div>
  <div class="controls">
    <input type="search" id="q" placeholder="Search findings, files, rules…">
    <label><input type="checkbox" class="sevfilter" value="high" checked> high</label>
    <label><input type="checkbox" class="sevfilter" value="medium" checked> medium</label>
    <label><input type="checkbox" class="sevfilter" value="low" checked> low</label>
    <label><input type="checkbox" class="sevfilter" value="info" checked> info</label>
    <select id="rule"><option value="">All rules</option></select>
  </div>
  <div id="list"></div>
</main>
<footer>
  Generated by Spec-Guardian. Findings are heuristic review hints, not security verdicts.
  Deep secret scanning is out of scope — use dedicated tools such as gitleaks.
</footer>
<script>
const REPORT = __SPECGUARDIAN_DATA__;
(function(){
  const byId = id => document.getElementById(id);
  byId('ver').textContent = REPORT.version || 'dev';
  const meta = byId('meta');
  const bits = [
    ['Repository', REPORT.root],
    ['Branch', REPORT.branch],
    ['Commit', REPORT.commit ? REPORT.commit.slice(0,10) : ''],
    ['Project', REPORT.projectType],
    ['Files', String(REPORT.fileCount || 0)],
    ['Offline', String(!!REPORT.offline)],
    ['Generated', REPORT.generatedAt]
  ];
  bits.filter(b=>b[1]).forEach(([k,v])=>{
    const s=document.createElement('span');
    s.innerHTML = k+': <code>'+escapeHtml(v)+'</code>';
    meta.appendChild(s);
  });

  const s = REPORT.summary || {};
  const cards = [['Total',s.total||0,''],['High',s.high||0,'high'],['Medium',s.medium||0,'medium'],['Low',s.low||0,'low'],['Info',s.info||0,'info']];
  byId('cards').innerHTML = cards.map(([l,n,c])=>
    '<div class="card '+c+'"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('');

  const ruleSel = byId('rule');
  [...new Set((REPORT.findings||[]).map(f=>f.ruleId))].sort().forEach(r=>{
    const o=document.createElement('option'); o.value=r; o.textContent=r; ruleSel.appendChild(o);
  });

  function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function render(){
    const q = byId('q').value.toLowerCase();
    const sevs = new Set([...document.querySelectorAll('.sevfilter:checked')].map(c=>c.value));
    const rule = ruleSel.value;
    const list = byId('list');
    list.innerHTML = '';
    const items = (REPORT.findings||[]).filter(f=>{
      if(!sevs.has(f.severity)) return false;
      if(rule && f.ruleId!==rule) return false;
      if(q){
        const hay=(f.ruleId+' '+(f.file||'')+' '+f.message+' '+f.severity).toLowerCase();
        if(!hay.includes(q)) return false;
      }
      return true;
    });
    if(!items.length){ list.innerHTML='<div class="empty">No findings match the current filter. 🎉</div>'; return; }
    items.forEach((f,i)=>{
      const d=document.createElement('details');
      d.className='finding'; d.dataset.sev=f.severity;
      const loc = f.file ? escapeHtml(f.file)+(f.line?':'+f.line:'') : '';
      const hasBody = f.remediation || f.docUrl || f.patch;
      d.innerHTML =
        '<summary>'+
          '<span class="sev '+f.severity+'">'+f.severity+'</span>'+
          '<span class="rid">'+escapeHtml(f.ruleId)+'</span>'+
          '<span class="msg">'+escapeHtml(f.message)+'</span>'+
          '<span class="loc">'+loc+'</span>'+
        '</summary>'+
        (hasBody?('<div class="body">'+
           (f.remediation?('<div class="fix"><strong>Fix:</strong> '+escapeHtml(f.remediation)+'</div>'):'')+
           (f.docUrl?('<div class="fix"><a href="'+escapeHtml(f.docUrl)+'" rel="noreferrer noopener" target="_blank">Rule documentation</a></div>'):'')+
           (f.patch?('<details><summary>Suggested patch preview</summary><pre>'+escapeHtml(f.patch)+'</pre></details>'):'')+
         '</div>'):'');
      list.appendChild(d);
      if(i===0 && items.length<20) d.open=true;
    });
  }
  byId('q').addEventListener('input', render);
  ruleSel.addEventListener('change', render);
  document.querySelectorAll('.sevfilter').forEach(c=>c.addEventListener('change', render));
  render();
})();
</script>
</body>
</html>
